[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks exported as source use spark/dbutils globals and MAGIC lines.
"Scripts/databricks/*.py" = ["F821", "E501"]

[tool.pytest.ini_options]
testpaths = ["Scripts/tests"]
pythonpath = ["."]
addopts = "-ra"
