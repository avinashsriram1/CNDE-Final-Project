name: ingest

# Part A: automated raw-zone ingestion. Downloads the three sources and writes them,
# unchanged except for PII removal, to gs://$GCS_BUCKET/raw/YYYY-MM-DD/<source>/.
on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays ~5 AM Chicago: charging stations (change daily)
    - cron: "37 11 3 * *"   # 3rd of each month: prices and registrations (monthly/yearly)
  workflow_dispatch:         # "Run workflow" button for demos and first runs
    inputs:
      sources:
        description: "Sources to run (space separated)"
        default: "afdc_stations eia_prices afdc_registrations"

permissions:
  contents: read
  id-token: write   # lets GitHub prove its identity to Google Cloud (no key file)

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # Keyless login (Workload Identity Federation). UChicago blocks service account key files.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Pick sources
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ github.event.inputs.sources }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "sources=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "17 11 * * 1" ]; then
            echo "sources=afdc_stations" >> "$GITHUB_OUTPUT"
          else
            echo "sources=eia_prices afdc_registrations" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ingestion
        env:
          NREL_API_KEY: ${{ secrets.NREL_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: python -m Scripts.ingestion.run --sources ${{ steps.pick.outputs.sources }}
