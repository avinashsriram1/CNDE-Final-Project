name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    # This job name is the required status check in branch protection. Don't rename it
    # without updating Scripts/deploy/github_repo_setup.sh.
    name: lint-and-test
    runs-on: ubuntu-latest   # standard runner only (free on public repos)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest

  # W1-8 (Part D, due 11/25) adds: Postgres service container -> apply DDL ->
  # load fixtures -> SQL assertions, plus a docker build of the pipeline image.
